schema: 1
description: D1 Max 单层 2D 地图生成；不启动 ROS 或导航，所有输出另存。
profiles:
  - id: conservative
    name: 结构保真 · 保留未知（推荐）
    parameters:
      filter_enabled: false
      statistical_mean_k: 20
      statistical_std_dev_mul: 0.5
      radius: 0.3
      radius_min_points: 4
      z_min: 0.4
      z_max: 1.5
      resolution: 0.05
      padding: 0.5
      min_points_per_cell: 1
      background: unknown
  - id: go2-compatible
    name: Go2 默认滤波 · 空白设为自由
    parameters:
      filter_enabled: true
      statistical_mean_k: 20
      statistical_std_dev_mul: 0.5
      radius: 0.3
      radius_min_points: 4
      z_min: 0.4
      z_max: 1.5
      resolution: 0.05
      padding: 0.5
      min_points_per_cell: 1
      background: free
