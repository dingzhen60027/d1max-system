d1max_sdk_monitor:
  ros__parameters:
    # SI limits; no movement is authorized by starting the monitor. A separate
    # explicit navigation arm is mandatory. Preserve the vendor low-speed mode.
    navigation_control_enabled: false
    navigation_max_forward_mps: 0.30
    navigation_max_lateral_mps: 0.0
    navigation_max_yaw_radps: 0.50
    navigation_command_timeout_sec: 0.25
    # User selects STAIR before navigation. No automatic SetMode / posture
    # commands; floors, stair flights and landings retain one actuation mode.
    execution_mode_policy: fixed_stair
    # User-authorized reuse of the complete existing GENERAL runtime mapping
    # (axis response, smoothing and exact zero). Not measured STAIR calibration.
    execution_stair_runtime_parameter_source: general_runtime_reuse
    # Optional physical STAIR measurement records are separate from runtime
    # configuration. Empty does not block explicitly configured runtime reuse
    # and never sets any measured/physical acceptance flag true.
    execution_mode_capability_record: ""
    execution_mode_capability_sha256: ""
    # Operator authorized APP -> SDK handoff. Only OnControlAvailable may arm
    # TakeControl; never infer availability from MC absence or control_source.
    # No motion/posture/mode/e-stop-release commands are enabled by this option.
    auto_take_control_on_available: true
    takeover_settle_sec: 0.5
    takeover_ack_timeout_sec: 3.0
    takeover_confirmation_timeout_sec: 4.0
    # SetMcConfig switches reporting on/off; it has NO frequency argument.
    mc_report_ready_delay_sec: 1.0
    mc_report_retry_sec: 3.0
    mc_report_max_attempts: 3
    # Three requests per burst, then 15 / 30 / 60 s cooldown. Only re-enable
    # telemetry; do not cycle the SDK socket or retry TakeControl / estop.
    mc_report_cooldown_sec: 15.0
    mc_report_max_cooldown_sec: 60.0
    mc_report_stream_timeout_sec: 1.0
