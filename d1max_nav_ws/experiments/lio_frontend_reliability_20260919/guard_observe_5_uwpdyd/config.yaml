laserMapping:
  ros__parameters:
    common:
      dataset: nclt
      imu_topic: /lio_guard_test/imu
      lid_topic: /lio_guard_test/points
      time_sync_en: false
    cube_side_length: 1000.0
    diagnostics:
      input_log_path: /home/dndx/d1max_nav_ws/experiments/lio_frontend_reliability_20260919/guard_observe_5_uwpdyd/input.csv
    esti_plane_threshold: 0.1
    feature_extract_enable: false
