    - -0.7323
trial:
  name: baseline
  classification: isolated offline diagnostic, not approved production calibration
  changed_variable: 'None: reproduces current central-IMU extrinsics; rear transform
    made explicit.'
  rotation_convention: column vectors; p_target=R_target_source*p_source+t_target_source;
    flat rotations row-major
  point_normalization: Retain the existing R_N_L and zero translation; do not apply
    DIFOP twice.
  central_translation_policy: Keep baseline nominal t_C_N exactly; not claiming a
    complete central-IMU calibration.
  driver_basis_status: Unverified for the exact recorded robot driver build; candidate
    test only.
  loop_closure: false
  scene_constraints: false
  middleware: rmw_zenoh_cpp
