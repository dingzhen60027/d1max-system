  bag: /home/dndx/d1max_nav_ws/bags/slam_raw_20260917_171716_fe8f38
  gyro_rotation_fit: calibration/gyro_rotation_candidate.json
  conventions_and_sources: calibration/calibration_notes.md
  rotation_method: Robust SO3 gyro fit using alternating 60-second train/heldout blocks,
    then expressed from existing normalized front IMU axes to raw central axes.
  time_method: central(t+13ms) best matches front(t); subtract 13ms from central header.
    May include filter phase, not a proven pure clock correction.
  acceleration_units: Inferred g from initial low-motion magnitude near 1; SDK units
    are not used as proof of this ROS topic's units.
  lever_arm_method: R_C_B = R_C_front_raw_IMU * R_B_front_raw_IMU_nominal.T; t_C_N
    = R_C_B * [0.366149765, 0.000000325, 0.000000219].
  manufacturer_nominal_base_from_front_raw_imu:
  - 0
  - 0
  - -1
  - -1
  - 0
  - 0
  - 0
  - 1
  - 0
  nominal_central_position_in_manufacturer_base_m:
  - 0.0
  - 0.0
  - 0.0
  limitations:
  - Central IMU physical origin is assumed at manufacturer base, not measured. CAD
    alternative IMU origins differ by centimeters; this is not an error bound.
  - No hardware model identity asserted for imu_link.
  - Existing dual LiDAR geometry and normalized point transform are deliberately retained;
    their separate calibration uncertainty remains.
  - No position-height lock, ground flattening or loop closure used.
  - Relative gyro-fit intercept is NOT subtracted as absolute central IMU bias; normal
    LIO initialization estimates bias.
  - Repeated six-axis messages are preserved and counted; this run is not a driver
    repair.
  trial_rotation_method: R_C_N = R_C_F_gyrofit * R_F_L_device_SN3009bede1530 * R_N_L_existing.T
  trial_manifest: ../manifest.json
