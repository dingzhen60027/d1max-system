schema: d1max.structure_cleaning/v1
id: sc-pgo-0923-crossfloor-structure-v1
name: 09-23 跨楼层 SC-PGO · 结构保留离群清理
description: 独立离群预处理；保留两层楼面、楼梯和建筑结构，不按高度裁剪或修改坐标。
input:
  path: ${D1MAX_NAV_ROOT}/maps/runs/20260923_132601_150357_central_imu_faster_lio_sc_pgo_zenoh/sc_pgo/optimized_map.pcd
  sha256: d629eb51baa5fec3ca75b596a7fce4e46286dcfd957e4010b3580fd16be6b803
  source_id: 36825b5945923b39
  source_name: 09-23 跨楼层 SC-PGO 优化地图
  frame_id: d1max_loc_map
output:
  root: ${D1MAX_APP_ROOT}/map_manager/data/processed
  basename: processed_map.pcd
  preserve_all_fields: true
  save_removed: true
  maximum_removed_fraction: 0.12
runtime:
  workers: 4
  maximum_points: 5000000
modules:
  - id: isolated-neighbors
    type: radius_outlier
    enabled: true
    parameters:
      radius_m: 0.15
      minimum_other_neighbors: 3
  - id: sparse-distance
    type: statistical_outlier
    enabled: true
    parameters:
      neighbors: 24
      std_ratio: 3.0
  - id: protect-local-structure
    type: structure_support
    enabled: true
    parameters:
      neighbors: 32
      minimum_neighbors: 8
      support_radius_m: 0.45
      trim_fraction: 0.75
      plane_fit_tolerance_m: 0.02
      maximum_surface_variation: 0.035
      minimum_plane_spread_m: 0.04
      query_to_plane_m: 0.025
      minimum_linearity_fraction: 0.98
      minimum_line_span_m: 0.15
      query_to_line_m: 0.02
      edge_allowance_m: 0.08
notes:
  - Source is the corrected 09-23 SC-PGO map with cross-floor false-loop protection.
  - The floor height difference and staircase geometry must remain measured, not flattened.
  - No voxel averaging, height clipping, smoothing, hole filling or coordinate changes.
  - All modules measure the unchanged finite input; deleting one point does not cascade.
  - Dense person ghosts and real static obstacles cannot be reliably distinguished from one accumulated PCD.
  - Removed points are archived separately; this does not activate a navigation map.
