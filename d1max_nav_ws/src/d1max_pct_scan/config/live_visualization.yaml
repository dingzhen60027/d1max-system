# Real localization -> native PCT -> native SCAN, visualization only.
# No controller, command gate, cmd_vel publisher or SDK connection is launched.
mode: LIVE_VISUALIZATION_NO_MOTION
motion_control_enabled: false
# Independent, per-acquisition dual-LiDAR rays; preview only until robot
# collision geometry / blind-space handling have been physically validated.
perception_backend: per_sensor_rays
# Read-only UI metadata, snapshotted with the session; not an algorithm selector.
display:
  map_name: 09-23 跨楼层 SC-PGO
  components:
    localization: {id: lio_pcd, name: LIO + PCD 定位}
    global_planner: {id: pct_native, name: PCT 全局规划}
    local_planner: {id: scan_planner, name: SCAN 局部规划}
map_pcd: /home/dndx/智元四足机器人D1 Max二次开发文档资料包v0.1.0/d1max_ros2/map_manager/data/processed/20260923_141005_sc-pgo-0923-crossfloor-structure-v1_2c7218/processed_map.pcd
planning_manifest: /home/dndx/d1max_nav_ws/maps/processed/sc_pgo_20260923_crossfloor_complete_001/manifest.json
tomogram_npz: /home/dndx/d1max_nav_ws/maps/processed/sc_pgo_20260923_crossfloor_complete_001/pct/tomogram.npz
crossfloor_route_config: /home/dndx/d1max_nav_ws/maps/processed/sc_pgo_20260923_crossfloor_complete_001/route.yaml
localization_config: /home/dndx/d1max_nav_ws/src/d1max_localization/config/localization.yaml
scan_config: /home/dndx/d1max_nav_ws/src/d1max_scan_planner/config/d1max_scan_planner.yaml
