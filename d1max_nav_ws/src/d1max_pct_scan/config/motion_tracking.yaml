# Body velocity contract; the SDK implements the wheel/leg actuator kinematics.
schema_version: 1
motion_model: holonomic
heading_policy: path_tangent
# Keep the platform's holonomic capability, but navigation requests only
# forward + continuous steering. Historical parameter name: NOT stop/align/go.
align_then_forward: true
controller_frequency_hz: 20.0
diagnostics_frequency_hz: 5.0
# Spatial convergence distance; uses measured speed, not an advancing clock.
preview_time_s: 1.2
min_lookahead_distance_m: 0.40
max_lookahead_distance_m: 0.80
# Tangent feed-forward + lateral convergence + continuous heading feedback.
position_gain: 0.80
yaw_gain: 0.90
heading_error_threshold_rad: 0.80
# Smoothly subtract small heading error; no engage/release angle or phase.
steering_error_scale_rad: 0.02
velocity_damping_gain: 0.0
yaw_damping_gain: 0.40
max_speed_mps: 0.30
max_yaw_radps: 0.50
max_acceleration_mps2: 0.35
max_yaw_acceleration_radps2: 0.80
# One conditioner jointly bounds SI derivatives and the mapped SDK input.
max_input_rate_per_s: 1.6
max_input_acceleration_per_s2: 12.0
# Command derivatives, not an assumed physical inertia or braking measurement.
max_jerk_mps3: 0.70
# Let angular acceleration reverse promptly, retaining the same 0.80 rad/s²
# acceleration bound and mapped-input slew limits; no second steering filter.
max_yaw_jerk_radps3: 4.0
