# Physical facts and engineering assumptions must not share the same provenance.
schema: 1
model: D1 Max
sources:
  specification:
    path: ${D1MAX_VENDOR_ROOT}/产品说明书/D1 Max产品规格书_v2.0_20260224.pdf
    page: 1
  sdk_move:
    path: ${D1MAX_VENDOR_ROOT}/sdk/中狗highlevel-sdk-v0.1.0-Chargingv2/ubuntu22.04/RobotSDK-0.1.0-charging_v2-x86_64/docs/zh/sdk_client_api_cn.md
    sections: [SetSpeed, Move]
  urdf:
    path: ${D1MAX_APP_ROOT}/urdf_ws/src/max_description/urdf/max.urdf
official:
  standing_size_m: {length: 0.930, width: 0.480, height: 0.585}
  prone_size_m: {length: 0.930, width: 0.630, height: 0.200}
  mass_with_batteries_kg: 41.0
  product_max_speed_mps: 8.0
  continuous_stair_height_m: 0.25
  max_slope_deg: 45.0
  laboratory_min_passage_width_m: 0.50
  # Capability ratings, not automatic permission to traverse any such terrain.
  sdk_slow_mode_from_client_api:
    forward_back_mps: 1.0
    left_right_mps: 0.5
    yaw_radps: 1.5
  sdk_speed_document_conflict: true
  sdk_speed_document_note: sdk_type_cn.md 的 SpeedLevel 表与 sdk_client_api_cn.md 的 SetSpeed 在轴向和低速角速度上不一致；未以此启用控制。
urdf_reference_only:
  # BASE_LINK -> sensor; do not reapply these to already world-frame clouds.
  front_lidar_xyz_m: [0.4043, 0.0, -0.0377]
  rear_lidar_xyz_m: [-0.4043, 0.0, -0.0377]
  lua300c_imu_xyz_m: [0.0, 0.0, 0.00569]
  # Asset-space bounds, NOT a physically accepted sensor/robot calibration.
  # max.urdf sha256 d53b63b6026c97296a5dd42d0bf98c4781034c2871ed531b24218595017b20fe
  # BASE_LINK.STL sha256 9ab81ddedd0bd423fb1292f652162842bee3c80a7138e630516aa4a05917ebd3
  torso_bounds_base_m:
    min: [-0.461078018, -0.118556112, -0.089300000]
    max: [0.461078018, 0.118556112, 0.087410957]
  # Outer mesh extent; the CAD wheel radius is about 9.6 cm, not diameter.
  foot_mesh_outer_diameter_m: 0.19191625714302063
  foot_mesh_thickness_m: 0.04649881273508072
  # Operator clarified 2026-10-10: previous 9 cm referred to radius.
  operator_wheel_dimensions_approx_m: {diameter: 0.19, thickness: 0.05}
  operator_wheel_dimensions_confirmed_at: '2026-10-10'
  operator_previous_wheel_diameter_description_m: 0.09
  wheel_diameter_provenance_conflict: false
  # Joint units/mapping, acquisition timing, posture and actual wheel model
  # are not physically calibrated. These bounds do not enable a self-filter.
  entity_self_filter_calibrated: false
engineering:
  mode: standing_preview_only
  motion_authorized: false
  # User's project limit, not the product's maximum and not SDK normalization.
  project_speed_limit_mps: 1.5
  preview_speed_mps: 0.30
  preview_acceleration_mps2: 0.35
  # User-provided 2026-09-28 (standing ground-to-base_link). Consistent with
  # 0.585 m standing height minus URDF BASE_LINK mesh top 0.087 m ~= 0.498 m.
  body_reference_height_m: 0.50
  body_height_calibrated: false
  # Ground-to-reference is a support/route conversion, NOT torso thickness.
  # Keep this independent from both candidate and execution collision kernels.
  # Operator-requested rigid proxy, not a claimed full wheel/leg envelope.
  # Width 0.30 m is the torso approximation, not the ~0.50 m feet outer span.
  # Center is BASE_LINK; lidar ground height is a separate stance input.
  collision_model: native_oriented_box_approximation
  box_length_m: 0.93
  box_width_m: 0.30
  box_height_m: 0.50
  box_body_below_m: 0.25
  box_body_above_m: 0.25
  box_geometry_provenance: operator_rigid_proxy_centered_base_link_not_measured
  # Retained only for selecting the legacy cylinder model.
  footprint_lateral_margin_m: 0.05
  footprint_longitudinal_margin_m: 0.025
  collision_envelope_validated: false
  # Historical engineering context, NOT a filter or a certificate that low
  # obstacles may be crossed. No raw ground/leg/wheel returns are erased.
  ground_exclusion_height_m: 0.10
  safety_scan_above_base_m: 0.80
  # Legacy cylinder execution envelope. Obstacle-UP
  # dilation covers BELOW the body reference; obstacle-DOWN covers ABOVE it.
  obstacle_dilation_up_m: 0.40
  obstacle_dilation_down_m: 0.45
  # Legacy cylinder candidate-search proxy is a torso-level geometric model.
  # .08930 m CAD lower extent + .03070 m engineering margin = .12000 m.
  # This does not cover moving wheel/leg geometry and cannot grant motion.
  planning_torso_lower_margin_m: 0.03070
  planning_body_below_m: 0.12
  planning_body_above_m: 0.45
  planning_geometry_provenance: cad_torso_with_unvalidated_margin
  planning_geometry_validated: false
  vertical_envelope_validated: false
  sdk_speed_mapping_validated: false
