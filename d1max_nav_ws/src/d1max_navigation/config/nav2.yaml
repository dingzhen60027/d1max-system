# ROS 2 Humble. The launcher places these nodes under /d1max/navigation.
# This is the navigation stack, not a second localization / TF authority.
# AMCL, SLAM, SDK control and robot drivers are intentionally absent.
# yaml_filename and the two BT XML paths are supplied by the session launcher.
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    frame_id: d1max_loc_map
    topic_name: /d1max/navigation/map

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      use_astar: true
      tolerance: 0.15
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /d1max/localization/odometry/local
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
    # DWB checks candidate trajectories against the live local costmap.
    # Forward-only differential-style commands are an initial conservative
    # policy, not a claim that the quadruped cannot move sideways.
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      publish_evaluation: false
      publish_trajectories: false
      publish_local_plan: true
      publish_global_plan: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.30
      max_vel_y: 0.0
      max_vel_theta: 0.50
      min_speed_xy: 0.0
      max_speed_xy: 0.30
      min_speed_theta: 0.0
      acc_lim_x: 0.40
      acc_lim_y: 0.0
      acc_lim_theta: 0.80
      decel_lim_x: -0.40
      decel_lim_y: 0.0
      decel_lim_theta: -0.80
      vx_samples: 16
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 2.0
      linear_granularity: 0.04
      angular_granularity: 0.03
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, PathAlign, GoalAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 0.05
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.25
      GoalAlign.scale: 16.0
      GoalAlign.forward_point_distance: 0.25
      PathDist.scale: 24.0
      GoalDist.scale: 16.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: d1max_loc_map
      robot_base_frame: d1max_loc_base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: true
      # Existing d1max_scan_planner/config/d1max_scan_planner.yaml uses the
      # supplied URDF-based 0.98 x 0.58 m conservative envelope. This is NOT
      # a verified swept-leg envelope or permission to drive through doors.
      footprint: "[[0.49, 0.29], [0.49, -0.29], [-0.49, -0.29], [-0.49, 0.29]]"
      footprint_padding: 0.03
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /d1max/navigation/map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /d1max/navigation/scan
          data_type: LaserScan
          clearing: true
          marking: true
          # Infinite beams are valid empty rays only when the input adapter
          # explicitly declares observed coverage; absent cloud bins are NaN.
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.5
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.35
          obstacle_max_range: 8.0
          raytrace_min_range: 0.35
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 4.0
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: d1max_loc_odom
      robot_base_frame: d1max_loc_base_link
      update_frequency: 10.0
      publish_frequency: 4.0
      transform_tolerance: 0.3
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.49, 0.29], [0.49, -0.29], [-0.49, -0.29], [-0.49, 0.29]]"
      footprint_padding: 0.03
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /d1max/navigation/map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /d1max/navigation/scan
          data_type: LaserScan
          clearing: true
          marking: true
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.5
          min_obstacle_height: -2.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.35
          obstacle_max_range: 8.0
          raytrace_min_range: 0.35
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 4.0
        inflate_unknown: false
        inflate_around_unknown: true
      always_send_full_costmap: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: d1max_loc_map
    robot_base_frame: d1max_loc_base_link
    odom_topic: /d1max/localization/odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Filled with package-share absolute paths by the launch file.
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_remove_passed_goals_action_bt_node

smoother_server:
  ros__parameters:
    use_sim_time: false
    robot_base_frame: d1max_loc_base_link
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    transform_tolerance: 0.2
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 500
      do_refinement: true

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: false
      waypoint_pause_duration: 0

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: d1max_loc_odom
    robot_base_frame: d1max_loc_base_link
    transform_tolerance: 0.2
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors/Wait

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 30.0
    scale_velocities: false
    feedback: CLOSED_LOOP
    odom_topic: /d1max/localization/odometry/local
    odom_duration: 0.1
    max_velocity: [0.30, 0.0, 0.50]
    min_velocity: [0.0, 0.0, -0.50]
    max_accel: [0.40, 0.0, 0.80]
    max_decel: [-0.40, 0.0, -0.80]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.35

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [map_server]
    bond_timeout: 4.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [planner_server, controller_server, smoother_server, behavior_server, velocity_smoother, collision_monitor, bt_navigator, waypoint_follower]
    bond_timeout: 4.0
    attempt_respawn_reconnection: false
