# 2026-09-23 SC-PGO corrected map: measured, non-flattened two-floor PCT build.
# The input was conservatively filtered by sc_pgo_0923_crossfloor_structure.yaml.
schema_version: 1
source_pcd: ${D1MAX_APP_ROOT}/map_manager/data/processed/20260923_141005_sc-pgo-0923-crossfloor-structure-v1_2c7218/processed_map.pcd
output_directory: ${D1MAX_NAV_ROOT}/maps/processed/sc_pgo_20260923_pct_crossfloor
vendor_root: ${D1MAX_NAV_ROOT}/src/pct_planner_vendor
frame_id: d1max_loc_map
preprocessing:
  # Remove only far-outside spurious returns; preserve the complete driven loop,
  # both stair runs, the landing, and the observed second-floor corridor.
  roi:
    min: [-48.0, -12.0, -3.0]
    max: [35.0, 62.0, 15.5]
  voxel_size_m: 0.0
  radius_outlier:
    enabled: false
    radius_m: 0.15
    minimum_neighbors: 3
pct:
  resolution: 0.20
  slice_dh: 0.50
  ground_height: -3.0
  simplify_layers: false
  limits:
    max_axis_cells: 2000
    max_layers: 128
    max_total_cells: 25000000
    max_working_bytes: 2500000000
  traversability:
    kernel_size: 7
    interval_min: 0.55
    interval_free: 0.70
    slope_max_rad: 0.40
    step_max: 0.17
    standable_ratio: 0.20
    cost_barrier: 50.0
    safe_margin: 0.20
    inflation: 0.20
export:
  traversable_pcd: true
notes:
  - Non-flattened building geometry; source-level ROI is bounded well outside the recorded trajectory.
  - Native PCT slice layers are not semantic building floor IDs.
  - No inferred floor, gateway, ceiling, or navigability outside measured support.
  - Static offline planning only; no robot, controller, SDK, or active map is changed.
