/**:
  ros__parameters:
    map_frame: map
    odom_frame: camera_init
    body_frame: body
    publish_tf: true
    use_current_stamp_for_aft_pgo_odom: true
    use_gps: false

    keyframe_meter_gap: 0.5
    keyframe_deg_gap: 4.0
    minimum_keyframe_points: 300
    max_sync_offset_sec: 0.02

    scancontext_filter_size: 0.20
    sc_dist_thres: 0.12
    sc_max_radius: 30.0
    loop_closure_frequency: 1.0

    icp_filter_size: 0.20
    icp_coarse_filter_size: 0.40
    icp_coarse_max_correspondence_distance: 2.0
    icp_min_reverse_overlap_ratio: 0.35
    history_keyframe_search_num: 8
    icp_max_correspondence_distance: 1.0
    icp_fitness_threshold: 0.03
    # Large-loop drift admission is distinct from the strict geometric quality
    # checks. Never use proximity or this allowance as proof of a loop.
    icp_max_correction_translation: 10.0
    icp_max_correction_rotation: 0.35
    icp_max_vertical_correction: 6.0
    # Keep the large-loop drift allowance, but reject a zero-height ICP match
    # across a concentrated climb/descent in uninterrupted LIO odometry.
    loop_vertical_transition_guard_enabled: true
    loop_vertical_transition_window_m: 20.0
    loop_vertical_transition_min_m: 1.5
    loop_vertical_transition_residual_m: 1.0
    icp_max_tilt_correction: 0.12
    icp_overlap_max_distance: 0.35
    icp_min_overlap_ratio: 0.65
    loop_max_relative_translation: 3.0
    loop_proximity_radius: 6.0
    loop_min_time_separation: 60.0
    loop_geometry_consistency_translation: 0.60
    loop_geometry_consistency_rotation: 0.06
    loop_min_keyframe_separation: 60
    loop_confirmation_count: 2
    loop_confirmation_window_keyframes: 5
    loop_candidate_index_tolerance: 8
    loop_accept_cooldown_keyframes: 15

    odom_rotation_stddev: 0.01
    odom_translation_stddev: 0.03
    loop_rotation_stddev: 0.02
    loop_translation_stddev: 0.08
    loop_robust_kernel_scale: 10.0

    mapviz_filter_size: 0.08
    map_skip_frames: 1
    map_publish_frequency: 0.20
    save_keyframe_scans: false
